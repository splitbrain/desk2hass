[package]
name = "desk2hass"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Linux desktop agent that reports idle time and webcam use to Home Assistant"
license = "MIT"

[[bin]]
name = "desk2hass"
path = "src/main.rs"

[dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
x11rb = { version = "0.14", features = ["screensaver"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
resvg = { version = "0.47", default-features = false }
usvg = { version = "0.47", default-features = false }
tiny-skia = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"
